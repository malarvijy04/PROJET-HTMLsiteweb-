<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réservation – Logifac</title>
  <link rel="stylesheet" href="../CSS/style.css">
  <script src="../JavaScript/script.js" defer></script>
</head>
<body>

  <header>
    <a href="index.html" class="logo">Logifac</a>
    <button type="button" class="burger" aria-label="Ouvrir le menu">&#9776;</button>
    <nav class="menu">
      <a href="index.html">Accueil</a>
      <a href="logement.html">Logements</a>
      <a href="reservation.html">Réservation</a>
      <a href="àpropos.html">À propos</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <h1>Réserver un logement</h1>

    <!-- La "value" de chaque option est le loyer par mois -->
    <form id="form-reservation">
      <label for="nom">Nom complet</label>
      <input type="text" id="nom" required>

      <label for="email">Email</label>
      <input type="email" id="email" required>

      <label for="logement">Type de logement</label>
      <select id="logement">
        <option value="450">Chambre en colocation (450 €)</option>
        <option value="600">Studio (600 €)</option>
        <option value="750">T1 (750 €)</option>
      </select>

      <label for="arrivee">Date d'arrivée</label>
      <input type="date" id="arrivee" required>

      <label for="duree">Durée (en mois)</label>
      <input type="number" id="duree" min="1" max="12" value="1" required>

      <p class="total">Total : <span id="prix">450</span> €</p>

      <button type="submit">Réserver</button>
      <p id="message"></p>
    </form>
  </main>

  <footer>
    <nav>
      <a href="àpropos.html">À propos</a>
      <a href="contact.html">Contact</a>
    </nav>
    <p>&copy; 2026 – Logifac</p>
  </footer>

</body>
</html>
